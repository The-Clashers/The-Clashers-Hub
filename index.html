<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The favicon (07 section 7): the gold shield, the same mark the
         nav bar's brand lockup draws, inlined as an SVG data URI the way
         the owner's prototype ships it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5z' fill='%23E0B84C'/%3E%3C/svg%3E"
    />
    <title>The Clashers Hub</title>
    <style>
      html {
        height: 100%;
        scrollbar-gutter: stable;
      }
      body {
        min-height: 100%;
        margin: 0;
      }
      /* The sticky-footer chain: #root is the flex column the nav spacer,
         the screen, and the footer stack inside. A percentage min-height
         cannot do the job: body's height is auto, so the percentage has
         nothing to resolve against and the footer floated loose on short
         pages. Viewport units resolve on their own; dvh (the dynamic
         viewport that tracks mobile URL bars) wins where supported and
         the vh line before it is the fallback. The screen's root grows
         (flex) inside this column, so it eats the free space and the
         footer lands on the viewport's bottom edge on short pages and
         rides below the content on long ones, every route the same. */
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
