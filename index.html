<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Clashers Hub</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* The app root is a flex child (appRoot uses flex: 1 so the screen
         chain has a bounded height), which only stretches when #root is a
         flex column. Without this the appRoot collapses to content height,
         the virtualized list gets no scroll container, and every item
         renders at once. */
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
