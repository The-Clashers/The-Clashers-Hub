<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The favicon (07 section 7): the gold shield, the same mark the
         nav bar's brand lockup draws, inlined as an SVG data URI the way
         the owner's prototype ships it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5z' fill='%23E0B84C'/%3E%3C/svg%3E"
    />
    <title>The Clashers Hub</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* The app root is a flex child (appRoot uses flex: 1 so the screen
         chain has a bounded height), which only stretches when #root is a
         flex column. Without this the appRoot collapses to content height,
         the virtualized list gets no scroll container, and every item
         renders at once. */
      #root {
        display: flex;
        flex-direction: column;
      }
      /* The document owns the scrolling on the page-flow screens (the
         roster tab, and the clan search since it joined the same scroll
         model), so switching between a short page and a long one would
         toggle the document scrollbar and reflow every centered and
         full-width element (the owner's "screen size changing" note).
         scrollbar-gutter: stable is the standard fix: the gutter is
         reserved always, the scrollbar only paints when there is
         something to scroll, and no element shifts when it appears.
         Overlay-scrollbar platforms (macOS, mobile) reserve nothing and
         never shifted in the first place. */
      html {
        scrollbar-gutter: stable;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
